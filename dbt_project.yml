# Project name must match dbt Cloud project and folder structure
name: 'transaction_analytics'
version: '1.0.0'
config-version: 2

# This must match the profile name configured in dbt Cloud
profile: 'default'

# File paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Global model configurations
models:
  transaction_analytics:

    # Default settings for all models
    +materialized: view
    +on_schema_change: sync_all_columns

    # Staging layer
    staging:
      +schema: STAGING
      +materialized: view

    # Intermediate layer (if present)
    intermediate:
      +schema: INTERMEDIATE
      +materialized: view

    # Mart layer (FACT / DIM)
    marts:
      +schema: MART
      +materialized: incremental
